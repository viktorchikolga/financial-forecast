<h2 class="sr-only">Финансовый прогноз на 6 месяцев</h2>
<style>
:root {
  --color-bg-primary: #ffffff;
  --color-border-tertiary: #e5e7eb;
  --color-text-primary: #111827;
  --color-text-secondary: #6b7280;
  --accent-blue: #3b82f6;
  --accent-green: #10b981;
  --accent-red: #ef4444;
}

*{box-sizing:border-box;margin:0;padding:0;font-family: system-ui, -apple-system, sans-serif}
.wrap{padding:1.5rem 0; max-width: 600px; margin: 0 auto;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.card-full{background:var(--color-bg-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.label{font-size:12px;color:var(--color-text-secondary);margin-bottom:0.25rem;text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em;}
.big{font-size:24px;font-weight:700}
.section{font-size:11px;color:var(--color-text-secondary);letter-spacing:0.06em;margin:1.5rem 0 0.8rem;text-transform:uppercase;font-weight:700;border-bottom: 1px solid var(--color-border-tertiary);padding-bottom:4px}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:0.875rem}
.sl-label{font-size:13px;color:var(--color-text-primary);min-width:130px}
.sl-val{font-size:13px;font-weight:600;min-width:80px;text-align:right}

.msg-box{border-radius:8px;padding:0.75rem 1rem;font-size:13px;line-height:1.5;margin-bottom:1rem}
.msg-ok{background:#EAF3DE;color:#3B6D11}
.msg-bad{background:#FCEBEB;color:#A32D2D}

/* Вертикальные подписи из файла gemini-code-1777149419800.html */
.chart-container {
  height: 240px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 4px;
  padding-top: 50px;
}
.bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
}
.bars-flex {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  width: 100%;
  height: 100%;
  border-bottom: 2px solid var(--color-border-tertiary);
}
.bar-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  height: 100%;
}
.bar {
  width: 100%;
  border-radius: 4px 4px 0 0;
  transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  min-height: 2px;
}
.bar-value {
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 8px;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  align-self: center;
  white-space: nowrap;
}
.bar-label {
  font-size: 11px;
  color: var(--color-text-secondary);
  margin-top: 10px;
  font-weight: 600;
}

.legend { display: flex; justify-content: center; gap: 20px; margin-top: 20px; font-size: 11px; color: var(--color-text-secondary); }
.dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }

/* Круговая диаграмма из файла Симулятор_Финансовый_прогноз.html */
.pie-section { display: flex; align-items: center; gap: 20px; justify-content: center; }
.pie-chart { width: 120px; height: 120px; border-radius: 50%; }
.pie-legend { font-size: 11px; color: var(--color-text-secondary); display: flex; flex-direction: column; gap: 4px; }

.anomaly-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 8px; align-items: center; }
select, .anom-input { padding: 6px; border-radius: 6px; border: 1px solid var(--color-border-tertiary); font-size: 13px; outline: none; }
</style>

<div class="wrap">
  <div class="card-full">
    <div class="label">Текущий баланс</div>
    <div style="display:flex;align-items:baseline;gap:8px">
      <input type="number" id="balance" value="2500" style="font-size:24px;font-weight:700;width:150px;border:none;background:transparent;outline:none;">
      <span style="font-size:18px;color:var(--color-text-secondary);font-weight:600">BYN</span>
    </div>
  </div>

  <div class="section">Расходы в месяц</div>
  <div class="slider-row"><span class="sl-label">Жилье</span><input type="range" min="0" max="3000" step="50" value="1000" id="rent" style="flex:1"><span class="sl-val" id="rent-v"></span></div>
  <div class="slider-row"><span class="sl-label">Подписки</span><input type="range" min="0" max="500" step="10" value="100" id="subs" style="flex:1"><span class="sl-val" id="subs-v"></span></div>
  <div class="slider-row"><span class="sl-label">Еда/Кафе</span><input type="range" min="0" max="2000" step="50" value="300" id="food" style="flex:1"><span class="sl-val" id="food-v"></span></div>
  <div class="slider-row"><span class="sl-label">Развлечения</span><input type="range" min="0" max="2000" step="50" value="300" id="fun" style="flex:1"><span class="sl-val" id="fun-v"></span></div>
  <div class="slider-row"><span class="sl-label">Инвестиции</span><input type="range" min="0" max="2000" step="50" value="500" id="inv" style="flex:1"><span class="sl-val" id="inv-v"></span></div>

  <div class="section">Сезонные аномалии (Разовые траты)</div>
  <div class="card-full" style="background: #f9fafb;">
    <div class="label" style="margin-bottom: 8px;">Добавить крупную трату</div>
    <div class="anomaly-row">
      <select id="anom-month">
        <option value="0">Январь</option><option value="1">Февраль</option><option value="2">Март</option>
        <option value="3">Апрель</option><option value="4">Май</option><option value="5">Июнь</option>
      </select>
      <input type="number" id="anom-value" class="anom-input" placeholder="Сумма, BYN">
      <button onclick="addAnomaly()" style="padding: 6px 15px; background: var(--accent-blue); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">+</button>
    </div>
    <div id="anomaly-list" style="margin-top: 10px; font-size: 11px;"></div>
  </div>

  <div class="section">Доходы</div>
  <div class="slider-row"><span class="sl-label">Доход</span><input type="range" min="500" max="10000" step="100" value="3000" id="income" style="flex:1"><span class="sl-val" id="income-v" style="color:var(--accent-green)"></span></div>
  <div class="slider-row"><span class="sl-label">Откладывать</span><input type="range" min="0" max="3000" step="50" value="500" id="save" style="flex:1"><span class="sl-val" id="save-v" style="color:var(--accent-green)"></span></div>

  <div id="msg-box" class="msg-box"></div>

  <div class="row">
    <div class="card-full" style="margin-bottom:0">
      <div class="label">Итого (6 мес.)</div>
      <div class="big" id="result-val" style="color:var(--accent-green)"></div>
    </div>
    <div class="card-full" style="margin-bottom:0">
      <div class="label">В копилке</div>
      <div class="big" id="saved-val" style="color:var(--accent-green)"></div>
    </div>
  </div>

  <div class="card-full">
    <div class="label">Прогноз баланса и накоплений</div>
    <div class="chart-container" id="chart"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--accent-blue)"></span>Баланс</span>
      <span><span class="dot" style="background:var(--accent-green)"></span>Копилка</span>
    </div>
  </div>

  <div class="card-full">
    <div class="label">Структура расходов</div>
    <div class="pie-section">
      <div id="pie" class="pie-chart"></div>
      <div class="pie-legend" id="pie-legend-list"></div>
    </div>
  </div>
</div>

<script>
const ids = ['balance','rent','subs','food','fun','inv','income','save'];
const months = ['Янв','Фев','Мар','Апр','Май','Июн'];
const pColors = ['#A32D2D', '#E24B4A', '#EF9F27', '#378ADD', '#639922'];
let anomalies = {}; 

function fmt(n){return Math.round(n).toLocaleString('ru');}

function addAnomaly() {
  const m = document.getElementById('anom-month').value;
  const val = parseFloat(document.getElementById('anom-value').value) || 0;
  if(val > 0) {
    anomalies[m] = (anomalies[m] || 0) + val;
    document.getElementById('anom-value').value = '';
    renderAnomalies();
    calc();
  }
}

function removeAnomaly(m) {
  delete anomalies[m];
  renderAnomalies();
  calc();
}

function renderAnomalies() {
  const list = document.getElementById('anomaly-list');
  list.innerHTML = '';
  for (let m in anomalies) {
    list.innerHTML += `<div style="display:flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px dashed #e5e7eb; padding-bottom: 2px;">
      <span>${months[m]}: <b>-${anomalies[m]} BYN</b></span>
      <span onclick="removeAnomaly(${m})" style="color: var(--accent-red); cursor: pointer; font-size: 11px;">[удалить]</span>
    </div>`;
  }
}

function calc() {
  const v = {};
  ids.forEach(id => {
    v[id] = parseFloat(document.getElementById(id).value) || 0;
    const disp = document.getElementById(id+'-v');
    if(disp) disp.textContent = v[id].toLocaleString('ru') + ' BYN';
  });

  const baseExp = v.rent + v.subs + v.food + v.fun + v.inv;
  const monthlyDelta = v.income - baseExp - v.save;
  
  const chart = document.getElementById('chart');
  chart.innerHTML = '';
  let currB = v.balance, currS = 0;
  const history = [];

  for(let i=0; i<6; i++) {
    currB += (monthlyDelta - (anomalies[i] || 0)); 
    currS += v.save;
    history.push({b: currB, s: currS});
  }

  document.getElementById('result-val').textContent = fmt(history[5].b) + ' BYN';
  document.getElementById('saved-val').textContent = fmt(currS) + ' BYN';

  const maxVal = Math.max(...history.map(h => Math.max(Math.abs(h.b), h.s)), 1000);
  const minVal = Math.min(0, ...history.map(h => h.b));
  const range = maxVal - minVal;

  history.forEach((h, i) => {
    const bH = (Math.abs(h.b) / range) * 100;
    const sH = (h.s / range) * 100;
    const bColor = h.b < 0 ? 'var(--accent-red)' : 'var(--accent-blue)';

    const group = document.createElement('div');
    group.className = 'bar-group';
    group.innerHTML = `
      <div class="bars-flex">
        <div class="bar-wrapper">
          <div class="bar-value" style="color:${bColor}">${fmt(h.b)}</div>
          <div class="bar" style="height:${Math.max(bH, 2)}%; background:${bColor}"></div>
        </div>
        <div class="bar-wrapper">
          <div class="bar-value" style="color:var(--accent-green)">${fmt(h.s)}</div>
          <div class="bar" style="height:${Math.max(sH, 2)}%; background:var(--accent-green)"></div>
        </div>
      </div>
      <div class="bar-label">${months[i]}</div>
    `;
    chart.appendChild(group);
  });

  const msg = document.getElementById('msg-box');
  if(history[5].b < 0) {
    msg.className='msg-box msg-bad'; msg.textContent='Внимание: баланс уйдет в минус к концу 6-го месяца.';
  } else {
    msg.className='msg-box msg-ok'; msg.textContent='Все под контролем! Баланс растет, накопления копятся.';
  }

  // Круговая диаграмма и легенда из Симулятор_Финансовый_прогноз.html
  const totalBase = baseExp > 0 ? baseExp : 1;
  const p = [v.rent, v.subs, v.food, v.fun, v.inv].map(x => (x/totalBase)*100);
  
  document.getElementById('pie').style.background = `conic-gradient(
    ${pColors[0]} 0% ${p[0]}%, 
    ${pColors[1]} ${p[0]}% ${p[0]+p[1]}%, 
    ${pColors[2]} ${p[0]+p[1]}% ${p[0]+p[1]+p[2]}%, 
    ${pColors[3]} ${p[0]+p[1]+p[2]}% ${p[0]+p[1]+p[2]+p[3]}%, 
    ${pColors[4]} ${p[0]+p[1]+p[2]+p[3]}% 100%)`;

  const labels = ['Жилье', 'Подписки', 'Еда', 'Досуг', 'Инвест'];
  let legendHtml = '<div class="pie-legend">';
  labels.forEach((lab, idx) => {
    legendHtml += `<div><span class="dot" style="background:${pColors[idx]}"></span> ${lab}: <b>${Math.round(p[idx])}%</b></div>`;
  });
  legendHtml += '</div>';
  document.getElementById('pie-legend-list').innerHTML = legendHtml;
}

document.querySelectorAll('input').forEach(el => el.addEventListener('input', calc));
calc();
</script>
